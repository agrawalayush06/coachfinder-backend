
  services:
    db:
      image: postgres:16
      container_name: coachfinder-db
      environment:
        POSTGRES_DB: coachfinder
        POSTGRES_USER: cf
        POSTGRES_PASSWORD: cf_dev
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

  volumes:
    pgdata: